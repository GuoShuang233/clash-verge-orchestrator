name: Orchestration backend check

on:
  push:
    branches:
      - dev
      - feature/subscription-orchestration
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
      - name: Upload formatted orchestration files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-orchestration
          path: |
            src-tauri/src/lib.rs
            src-tauri/src/cmd/orchestration.rs
            src-tauri/src/orchestration/mod.rs
          if-no-files-found: error
      - name: Check backend
        run: cargo check --manifest-path ./src-tauri/Cargo.toml --all-features
      - name: Run orchestration tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml --all-features orchestration
